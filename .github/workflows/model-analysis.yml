name: Model Analysis Check

on:
  push:
    paths:
      - 'templates/**.json'
      - 'scripts/analyze_models.py'
      - 'scripts/run_model_analysis_ci.sh'
      - 'tests/test_model_analysis_ci.py'
      - '.github/workflows/model-analysis.yml'
  pull_request:
    paths:
      - 'templates/**.json'
      - 'scripts/analyze_models.py'
      - 'scripts/run_model_analysis_ci.sh'
      - 'tests/test_model_analysis_ci.py'
      - '.github/workflows/model-analysis.yml'

permissions:
  contents: read

jobs:
  model-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout unprivileged pull request source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test CI failure handling
        run: python3 -m unittest discover -s tests -p test_model_analysis_ci.py -v

      - name: Analyze model specifications
        run: bash scripts/run_model_analysis_ci.sh
